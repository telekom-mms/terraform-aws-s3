
---
name: terraform-ci

on:
  pull_request:
    branches: [main]

env:
  TEMPLATE_REPOSITORY: telekom-mms/terraform-template

jobs:
  call-terraform-ci:
    if: github.repository != '$TEMPLATE_REPOSITORY'
    uses: telekom-mms/.github/.github/workflows/terraform-ci.yml@313967c681dc08d00173a149633302f10b129dfc # main
    with:
      working-directory: examples/s3-basic
